<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#393F4B" data-theme-color />
    <link rel="icon" href="./public/favicon.svg" type="image/svg+xml" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem('miracle-boost-theme');
          const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = savedTheme || systemTheme;
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <link rel="stylesheet" href="./src/admin.css" />
    <title>Miracle Boost — админ-панель чата</title>
  </head>
  <body>
    <button class="admin-theme-toggle" type="button" data-theme-toggle aria-label="Переключить тему" aria-pressed="false">
      <span data-theme-icon>☀</span>
      <span data-theme-label>Светлая</span>
    </button>

    <main class="admin-shell">
      <section class="login-card" data-login-screen>
        <div class="login-card__brand">
          <span>M</span>
          <div>
            <strong>miracle boost</strong>
            <small>admin panel</small>
          </div>
        </div>
        <h1>Вход в админ-панель</h1>
        <p>Авторизуйтесь, чтобы отвечать клиентам из чата на сайте.</p>

        <label>
          <span>Login</span>
          <input type="email" autocomplete="username" data-login-email />
        </label>
        <label>
          <span>Password</span>
          <input type="password" autocomplete="current-password" data-login-password />
        </label>
        <button type="button" data-login-button>Войти</button>
        <p class="login-card__error" data-login-error role="alert"></p>
      </section>

      <section class="panel" data-admin-panel hidden>
        <aside class="sidebar">
          <div class="sidebar__top">
            <div class="login-card__brand login-card__brand--compact">
              <span>M</span>
              <div>
                <strong>miracle boost</strong>
                <small>orders & chat</small>
              </div>
            </div>
            <button type="button" data-logout>Выйти</button>
          </div>
          <div class="sidebar__status">
            <span data-online-dot></span>
            <p data-connection-status>Подключение...</p>
          </div>
          <div class="sidebar__tabs"><button class="is-active" type="button" data-admin-tab="orders">Заказы</button><button type="button" data-admin-tab="chats">Чат</button></div><div class="sidebar__list" data-orders></div><div class="sidebar__list" data-conversations hidden></div>
        </aside>

        <section class="chat-admin">
          <header class="chat-admin__header">
            <div>
              <span data-active-type>Заказ</span>
              <h1 data-active-title>Выберите заказ</h1>
            </div>
            <button type="button" data-refresh>Обновить</button>
          </header>

          <div class="chat-admin__messages" data-admin-messages>
            <div class="empty-state">
              <strong>Нет выбранного диалога</strong>
              <p>Когда клиент напишет в чат на сайте, диалог появится слева.</p>
            </div>
          </div>

          <div class="chat-admin__reply">
            <textarea rows="2" placeholder="Введите ответ клиенту" data-admin-input></textarea>
            <button type="button" data-admin-send>Отправить</button>
          </div>
        </section>
      </section>
    </main>

    <script type="module" src="./src/admin.js"></script>
  </body>
</html>
